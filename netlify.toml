[build]
  publish = "dist"
  command = "yarn build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version" # проверка npm

# Правильная обработка статических маршрутов
[[redirects]]
  from = "/inner-app"
  to = "/inner-app/index.html"
  status = 200

[[redirects]]  
  from = "/inner-app/"
  to = "/inner-app/index.html"
  status = 200

[[redirects]]
  from = "/inner-app/basket"
  to = "/inner-app/basket/index.html"
  status = 200

[[redirects]]
  from = "/inner-app/basket/"
  to = "/inner-app/basket/index.html"
  status = 200

[[redirects]]
  from = "/inner-app/products/:id"
  to = "/inner-app/products/:id/index.html"
  status = 200

# Headers для PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

# CORS для API
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
